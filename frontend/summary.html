<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summary – Bill Splitter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body style="background:#0D0D1A" class="min-h-screen pb-10" x-data="summaryPage()" x-init="init()">

  <!-- Nav -->
  <nav class="neon-nav">
    <div class="max-w-lg mx-auto px-4 h-14 flex items-center gap-3">
      <a href="/dashboard.html" style="color:#A0A0C0" class="hover:text-white transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </a>
      <span class="font-bold text-white">Bill Summary</span>
    </div>
  </nav>

  <div class="max-w-lg mx-auto px-4 py-6 space-y-5">

    <!-- Loading -->
    <div x-show="loading" class="text-center py-16" style="color:#A0A0C0">
      <div class="text-4xl mb-3">⏳</div>
      Loading summary…
    </div>

    <template x-if="!loading && summary">
      <div class="space-y-5">

        <!-- Grand total hero card -->
        <div class="rounded-2xl p-6 text-center relative overflow-hidden"
          style="background: linear-gradient(135deg, #7C3AED 0%, #00F5FF 100%); box-shadow: 0 0 40px rgba(124,58,237,0.5)">
          <div class="text-sm font-semibold mb-1" style="color:rgba(255,255,255,0.75)">Grand Total</div>
          <div class="text-5xl font-black text-white mb-1" x-text="`$${summary.grand_total.toFixed(2)}`"></div>
          <div class="mt-3 flex flex-wrap justify-center gap-4 text-sm" style="color:rgba(255,255,255,0.8)">
            <span>Subtotal: <strong class="text-white" x-text="`$${summary.subtotal.toFixed(2)}`"></strong></span>
            <span x-show="summary.vat_amount > 0">VAT: <strong class="text-white" x-text="`$${summary.vat_amount.toFixed(2)}`"></strong></span>
            <span x-show="summary.service_amount > 0">Svc: <strong class="text-white" x-text="`$${summary.service_amount.toFixed(2)}`"></strong></span>
            <span x-show="summary.discount_amount > 0">Disc: <strong class="text-white" x-text="`-$${summary.discount_amount.toFixed(2)}`"></strong></span>
          </div>
        </div>

        <!-- Chart -->
        <div x-show="summary.friends.length > 0" class="neon-card p-5">
          <h2 class="font-bold text-white mb-4 text-center">Who Owes What</h2>
          <div class="relative h-56 flex items-center justify-center">
            <canvas id="splitChart"></canvas>
          </div>
        </div>

        <!-- Per-friend breakdown -->
        <div class="neon-card p-5">
          <h2 class="font-bold text-white mb-4">Breakdown</h2>
          <div class="space-y-2">
            <template x-for="(f, idx) in summary.friends" :key="f.friend_id">
              <div class="rounded-xl overflow-hidden" style="border:1px solid #2D2D4E">
                <button @click="expanded[f.friend_id] = !expanded[f.friend_id]"
                  class="w-full flex items-center justify-between px-4 py-3 transition-colors"
                  style="background:#12122A"
                  onmouseover="this.style.background='#1e1e3a'" onmouseout="this.style.background='#12122A'">
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold text-white flex-shrink-0"
                      :style="`background:${chartColors[idx % chartColors.length]}33; border:2px solid ${chartColors[idx % chartColors.length]}; color:${chartColors[idx % chartColors.length]}`"
                      x-text="f.name[0].toUpperCase()"></div>
                    <span class="font-medium text-white" x-text="f.name"></span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-lg amount-display" x-text="`$${f.total.toFixed(2)}`"></span>
                    <svg class="w-4 h-4 transition-transform" style="color:#A0A0C0" :class="expanded[f.friend_id] ? 'rotate-90' : ''"
                      fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                  </div>
                </button>
                <div x-show="expanded[f.friend_id]" class="px-4 py-3 space-y-1.5 text-sm"
                  style="background:#0D0D1A; border-top:1px solid #2D2D4E; color:#A0A0C0">
                  <div class="flex justify-between">
                    <span>Items subtotal</span>
                    <span class="text-white" x-text="`$${f.items_subtotal.toFixed(2)}`"></span>
                  </div>
                  <div class="flex justify-between" x-show="f.extras_share !== 0">
                    <span>Taxes &amp; charges share</span>
                    <span class="text-white" x-text="`$${f.extras_share.toFixed(2)}`"></span>
                  </div>
                  <div class="flex justify-between font-semibold pt-1.5" style="border-top:1px solid #2D2D4E; color:#00F5FF">
                    <span>Total</span>
                    <span x-text="`$${f.total.toFixed(2)}`"></span>
                  </div>
                </div>
              </div>
            </template>

            <!-- Unassigned -->
            <div x-show="summary.unassigned_subtotal > 0"
              class="rounded-xl px-4 py-3 flex justify-between text-sm"
              style="border:1px solid rgba(255,160,0,0.4); background:rgba(255,160,0,0.06); color:#FFA000">
              <span class="font-medium">Unassigned items</span>
              <span class="font-bold" x-text="`$${summary.unassigned_subtotal.toFixed(2)}`"></span>
            </div>

            <div x-show="summary.friends.length === 0" class="text-center py-6 text-sm" style="color:#A0A0C0">
              No friends were assigned to any items.
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-3">
          <button @click="shareResult()" class="neon-btn neon-btn-ghost flex-1 text-sm gap-2">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
            Share
          </button>
          <a href="/upload.html" class="neon-btn neon-btn-primary flex-1 text-sm no-underline">
            Split Another Bill
          </a>
        </div>

      </div>
    </template>

  </div>

  <div id="toast" class="toast"></div>
  <script src="/js/api.js"></script>
  <script src="/js/summary.js"></script>
</body>
</html>
