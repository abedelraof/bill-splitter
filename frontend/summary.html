<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summary – Bill Splitter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen bg-gray-50" x-data="summaryPage()" x-init="init()">

  <!-- Nav -->
  <nav class="bg-white border-b border-gray-100 sticky top-0 z-10">
    <div class="max-w-lg mx-auto px-4 h-14 flex items-center gap-3">
      <a href="/dashboard.html" class="text-gray-400 hover:text-indigo-600 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </a>
      <span class="font-bold text-gray-800">Bill Summary</span>
    </div>
  </nav>

  <div class="max-w-lg mx-auto px-4 py-6 space-y-5">

    <!-- Loading -->
    <div x-show="loading" class="text-center py-12 text-gray-400">Loading summary…</div>

    <template x-if="!loading && summary">

      <div class="space-y-5">

        <!-- Grand total card -->
        <div class="bg-indigo-600 text-white rounded-2xl p-6 text-center shadow">
          <div class="text-indigo-200 text-sm mb-1">Grand Total</div>
          <div class="text-4xl font-bold" x-text="`$${summary.grand_total.toFixed(2)}`"></div>
          <div class="mt-3 flex justify-center gap-6 text-sm text-indigo-200">
            <span>Subtotal: <strong class="text-white" x-text="`$${summary.subtotal.toFixed(2)}`"></strong></span>
            <span x-show="summary.vat_amount > 0">VAT: <strong class="text-white" x-text="`$${summary.vat_amount.toFixed(2)}`"></strong></span>
            <span x-show="summary.service_amount > 0">Svc: <strong class="text-white" x-text="`$${summary.service_amount.toFixed(2)}`"></strong></span>
            <span x-show="summary.discount_amount > 0">Disc: <strong class="text-white" x-text="`-$${summary.discount_amount.toFixed(2)}`"></strong></span>
          </div>
        </div>

        <!-- Chart -->
        <div x-show="summary.friends.length > 0" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <h2 class="font-bold text-gray-800 mb-4 text-center">Who Owes What</h2>
          <div class="relative h-56 flex items-center justify-center">
            <canvas id="splitChart"></canvas>
          </div>
        </div>

        <!-- Per-friend breakdown -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <h2 class="font-bold text-gray-800 mb-4">Breakdown</h2>
          <div class="space-y-3">
            <template x-for="(f, idx) in summary.friends" :key="f.friend_id">
              <div class="border border-gray-100 rounded-xl overflow-hidden">
                <button @click="expanded[f.friend_id] = !expanded[f.friend_id]"
                  class="w-full flex items-center justify-between px-4 py-3 hover:bg-gray-50 transition-colors">
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold text-white flex-shrink-0"
                      :style="`background:${chartColors[idx % chartColors.length]}`"
                      x-text="f.name[0].toUpperCase()"></div>
                    <span class="font-medium text-gray-800" x-text="f.name"></span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-indigo-700 text-lg" x-text="`$${f.total.toFixed(2)}`"></span>
                    <svg class="w-4 h-4 text-gray-300 transition-transform" :class="expanded[f.friend_id] ? 'rotate-90' : ''"
                      fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                  </div>
                </button>
                <div x-show="expanded[f.friend_id]" class="border-t border-gray-100 px-4 py-3 space-y-1 text-sm text-gray-600 bg-gray-50">
                  <div class="flex justify-between">
                    <span>Items subtotal</span>
                    <span x-text="`$${f.items_subtotal.toFixed(2)}`"></span>
                  </div>
                  <div class="flex justify-between" x-show="f.extras_share !== 0">
                    <span>Taxes &amp; charges share</span>
                    <span x-text="`$${f.extras_share.toFixed(2)}`"></span>
                  </div>
                  <div class="flex justify-between font-semibold text-gray-800 pt-1 border-t border-gray-200">
                    <span>Total</span>
                    <span x-text="`$${f.total.toFixed(2)}`"></span>
                  </div>
                </div>
              </div>
            </template>

            <!-- Unassigned -->
            <div x-show="summary.unassigned_subtotal > 0"
              class="border border-amber-200 bg-amber-50 rounded-xl px-4 py-3 flex justify-between text-sm">
              <span class="text-amber-700 font-medium">Unassigned items</span>
              <span class="text-amber-700 font-bold" x-text="`$${summary.unassigned_subtotal.toFixed(2)}`"></span>
            </div>

            <div x-show="summary.friends.length === 0" class="text-center text-gray-400 text-sm py-4">
              No friends were assigned to any items.
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-3">
          <button @click="shareResult()"
            class="flex-1 border border-gray-200 text-gray-700 hover:bg-gray-50 font-medium py-3 rounded-xl transition-colors text-sm flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
            Share
          </button>
          <a href="/upload.html" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-colors text-sm text-center">
            Split Another Bill
          </a>
        </div>

      </div>
    </template>

  </div>

  <div id="toast" class="toast"></div>
  <script src="/js/api.js"></script>
  <script src="/js/summary.js"></script>
</body>
</html>
