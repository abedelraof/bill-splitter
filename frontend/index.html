<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Splitter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 to-purple-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md" x-data="authPage()">
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">🧾</div>
      <h1 class="text-3xl font-bold text-indigo-700">Bill Splitter</h1>
      <p class="text-gray-500 mt-1">Split bills fairly with AI</p>
    </div>

    <!-- Tab switcher -->
    <div class="flex bg-white rounded-2xl shadow-sm border border-gray-100 p-1 mb-6">
      <button @click="tab='login'" :class="tab==='login' ? 'bg-indigo-600 text-white shadow' : 'text-gray-500 hover:text-gray-700'"
        class="flex-1 py-2.5 rounded-xl text-sm font-semibold transition-all">Sign In</button>
      <button @click="tab='signup'" :class="tab==='signup' ? 'bg-indigo-600 text-white shadow' : 'text-gray-500 hover:text-gray-700'"
        class="flex-1 py-2.5 rounded-xl text-sm font-semibold transition-all">Sign Up</button>
    </div>

    <!-- Login form -->
    <div x-show="tab==='login'" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input x-model="email" type="email" placeholder="you@example.com" autocomplete="email"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input x-model="password" type="password" placeholder="••••••••" autocomplete="current-password"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
          @keydown.enter="login()">
      </div>
      <div x-show="error" x-text="error" class="text-red-600 text-sm bg-red-50 rounded-xl px-4 py-2"></div>
      <button @click="login()" :disabled="loading"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-colors disabled:opacity-60">
        <span x-show="!loading">Sign In</span>
        <span x-show="loading">Signing in…</span>
      </button>
    </div>

    <!-- Signup form -->
    <div x-show="tab==='signup'" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input x-model="email" type="email" placeholder="you@example.com" autocomplete="email"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input x-model="password" type="password" placeholder="••••••••" autocomplete="new-password"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
          @keydown.enter="signup()">
      </div>
      <div x-show="error" x-text="error" class="text-red-600 text-sm bg-red-50 rounded-xl px-4 py-2"></div>
      <button @click="signup()" :disabled="loading"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-colors disabled:opacity-60">
        <span x-show="!loading">Create Account</span>
        <span x-show="loading">Creating account…</span>
      </button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
