<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Splitter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body style="background:#0D0D1A" class="min-h-screen flex items-center justify-center p-5" x-data="authPage()">

  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="text-center mb-10">
      <div class="text-6xl mb-4">🧾</div>
      <h1 class="text-3xl font-black text-white tracking-tight">Bill Splitter</h1>
      <p class="mt-1" style="color:#A0A0C0">Split smarter with AI</p>
    </div>

    <!-- Tab bar -->
    <div class="neon-tab-bar mb-5">
      <button class="neon-tab" :class="tab==='login' && 'active'" @click="tab='login'">Sign In</button>
      <button class="neon-tab" :class="tab==='signup' && 'active'" @click="tab='signup'">Sign Up</button>
    </div>

    <!-- Form card -->
    <div class="neon-card p-6 space-y-4">

      <div>
        <label class="label-muted block mb-1.5">Email</label>
        <input x-model="email" type="email" placeholder="you@example.com" autocomplete="email" class="neon-input">
      </div>

      <div>
        <label class="label-muted block mb-1.5">Password</label>
        <input x-model="password" type="password" placeholder="••••••••"
          :autocomplete="tab==='login' ? 'current-password' : 'new-password'"
          class="neon-input" @keydown.enter="tab==='login' ? login() : signup()">
      </div>

      <!-- Error -->
      <div x-show="error" x-text="error"
        class="text-sm rounded-xl px-4 py-2.5" style="color:#FF006E; background:rgba(255,0,110,0.08); border:1px solid rgba(255,0,110,0.2)"></div>

      <!-- Submit -->
      <button @click="tab==='login' ? login() : signup()" :disabled="loading" class="neon-btn neon-btn-primary mt-1">
        <span x-show="!loading" x-text="tab==='login' ? 'Sign In' : 'Create Account'"></span>
        <span x-show="loading">Please wait…</span>
      </button>

    </div>

    <p class="text-center mt-5 text-xs" style="color:#A0A0C0">
      Your Claude API key stays private — stored securely on the server.
    </p>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
