<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings – Bill Splitter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen bg-gray-50" x-data="settingsPage()" x-init="init()">

  <!-- Nav -->
  <nav class="bg-white border-b border-gray-100 sticky top-0 z-10">
    <div class="max-w-lg mx-auto px-4 h-14 flex items-center gap-3">
      <a href="/dashboard.html" class="text-gray-400 hover:text-indigo-600 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </a>
      <span class="font-bold text-gray-800">Settings</span>
    </div>
  </nav>

  <div class="max-w-lg mx-auto px-4 py-6 space-y-5">

    <!-- Claude API Key -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 space-y-4">
      <div>
        <h2 class="font-bold text-gray-800 mb-1 flex items-center gap-2">
          <span>🤖</span> Claude AI Key
        </h2>
        <p class="text-sm text-gray-500">Your key is used server-side to parse bill images. It's never shared.</p>
      </div>

      <!-- Current key status -->
      <div x-show="currentPreview" class="flex items-center gap-3 bg-green-50 border border-green-200 rounded-xl px-4 py-3">
        <svg class="w-4 h-4 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        <div class="text-sm">
          <div class="font-medium text-green-800">API key connected</div>
          <div class="text-green-600 font-mono text-xs" x-text="currentPreview"></div>
        </div>
      </div>
      <div x-show="!currentPreview && !loading" class="flex items-center gap-3 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3">
        <svg class="w-4 h-4 text-amber-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <div class="text-sm text-amber-700">No API key set — AI parsing won't work until you add one.</div>
      </div>

      <!-- New key input -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          <span x-text="currentPreview ? 'Update API key' : 'Enter your API key'"></span>
        </label>
        <input x-model="newKey" type="password" placeholder="sk-ant-api03-..." autocomplete="off"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-400"
          @keydown.enter="saveKey()">
        <p class="text-xs text-gray-400 mt-1.5">
          Get your key at
          <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener"
            class="text-indigo-500 hover:underline">console.anthropic.com</a>
        </p>
      </div>

      <div x-show="error" x-text="error" class="text-red-600 text-sm bg-red-50 rounded-xl px-4 py-2"></div>

      <button @click="saveKey()" :disabled="!newKey.trim() || saving"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-colors disabled:opacity-50">
        <span x-show="!saving">Save Key</span>
        <span x-show="saving">Saving…</span>
      </button>
    </div>

    <!-- Account -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
      <h2 class="font-bold text-gray-800 mb-1">Account</h2>
      <p class="text-sm text-gray-500 mb-4" x-text="email || 'Loading…'"></p>
      <button @click="logout()"
        class="w-full border border-red-200 text-red-500 hover:bg-red-50 font-medium py-3 rounded-xl transition-colors text-sm">
        Sign Out
      </button>
    </div>

  </div>

  <div id="toast" class="toast"></div>
  <script src="/js/api.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
