<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings – Bill Splitter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body style="background:#0D0D1A" class="min-h-screen pb-10" x-data="settingsPage()" x-init="init()">

  <!-- Nav -->
  <nav class="neon-nav">
    <div class="max-w-lg mx-auto px-4 h-14 flex items-center gap-3">
      <a href="/dashboard.html" style="color:#A0A0C0" class="hover:text-white transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </a>
      <span class="font-bold text-white">Settings</span>
    </div>
  </nav>

  <div class="max-w-lg mx-auto px-4 py-6 space-y-5">

    <!-- Claude API Key -->
    <div class="neon-card p-5 space-y-4">
      <div>
        <h2 class="font-bold text-white mb-1 flex items-center gap-2">
          <span>🤖</span> Claude AI Key
        </h2>
        <p class="text-sm" style="color:#A0A0C0">Your key is used server-side to parse bill images. It's never shared.</p>
      </div>

      <!-- Key connected -->
      <div x-show="currentPreview" class="flex items-center gap-3 rounded-xl px-4 py-3"
        style="background:rgba(0,255,135,0.06); border:1px solid rgba(0,255,135,0.25)">
        <span class="status-dot-green flex-shrink-0"></span>
        <div class="text-sm">
          <div class="font-semibold" style="color:#00FF87">API key connected</div>
          <div class="font-mono text-xs mt-0.5" style="color:#A0A0C0" x-text="currentPreview"></div>
        </div>
      </div>

      <!-- No key warning -->
      <div x-show="!currentPreview && !loading" class="flex items-center gap-3 rounded-xl px-4 py-3"
        style="background:rgba(255,160,0,0.06); border:1px solid rgba(255,160,0,0.3)">
        <svg class="w-4 h-4 flex-shrink-0" style="color:#FFA000" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <div class="text-sm" style="color:#FFA000">No API key set — AI parsing won't work until you add one.</div>
      </div>

      <!-- Input -->
      <div>
        <label class="label-muted block mb-1.5" x-text="currentPreview ? 'Update API key' : 'Enter your API key'"></label>
        <input x-model="newKey" type="password" placeholder="sk-ant-api03-…" autocomplete="off"
          class="neon-input font-mono text-sm"
          @keydown.enter="saveKey()">
        <p class="text-xs mt-1.5" style="color:#A0A0C0">
          Get your key at
          <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener"
            class="cyan-text hover:underline">console.anthropic.com</a>
        </p>
      </div>

      <div x-show="error" x-text="error" class="text-sm rounded-xl px-4 py-2.5"
        style="color:#FF006E; background:rgba(255,0,110,0.08); border:1px solid rgba(255,0,110,0.2)"></div>

      <button @click="saveKey()" :disabled="!newKey.trim() || saving" class="neon-btn neon-btn-primary">
        <span x-show="!saving">Save Key</span>
        <span x-show="saving">Saving…</span>
      </button>
    </div>

    <!-- Account -->
    <div class="neon-card p-5">
      <h2 class="font-bold text-white mb-1">Account</h2>
      <p class="text-sm mb-4" style="color:#A0A0C0" x-text="email || 'Loading…'"></p>
      <button @click="logout()" class="neon-btn"
        style="background:rgba(255,0,110,0.08); border:1px solid rgba(255,0,110,0.3); color:#FF006E; font-weight:600"
        onmouseover="this.style.background='rgba(255,0,110,0.15)'" onmouseout="this.style.background='rgba(255,0,110,0.08)'">
        Sign Out
      </button>
    </div>

  </div>

  <div id="toast" class="toast"></div>
  <script src="/js/api.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
