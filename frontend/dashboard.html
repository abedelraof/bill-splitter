<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – Bill Splitter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body style="background:#0D0D1A" class="min-h-screen pb-10" x-data="dashboardPage()" x-init="init()">

  <!-- Nav -->
  <nav class="neon-nav">
    <div class="max-w-lg mx-auto px-4 h-14 flex items-center justify-between">
      <span class="font-black text-lg text-white tracking-tight">🧾 Bill Splitter</span>
      <div class="flex items-center gap-4">
        <a href="/settings.html" style="color:#A0A0C0" class="hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </a>
        <button @click="logout()" class="text-sm" style="color:#A0A0C0">Sign out</button>
      </div>
    </div>
  </nav>

  <div class="max-w-lg mx-auto px-4 py-6 space-y-5">

    <!-- Split New Bill CTA -->
    <a href="/upload.html" class="neon-gradient-btn block text-center no-underline">
      <div class="text-3xl mb-1">📷</div>
      <div class="text-lg font-black">Split a New Bill</div>
      <div class="text-sm mt-0.5 opacity-80">Upload or photograph your receipt</div>
    </a>

    <!-- Friends -->
    <div class="neon-card p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-white flex items-center gap-2">👥 Friends</h2>
        <span class="label-muted" x-text="`${friends.length} friend${friends.length!==1?'s':''}`"></span>
      </div>

      <!-- Add friend -->
      <div class="flex gap-2 mb-4">
        <input x-model="newFriendName" type="text" placeholder="Friend's name" maxlength="100"
          class="neon-input" style="border-radius:0.75rem"
          @keydown.enter="addFriend()">
        <button @click="addFriend()" :disabled="!newFriendName.trim()"
          class="neon-btn neon-btn-primary" style="width:auto; padding:0 1.25rem; white-space:nowrap">Add</button>
      </div>

      <!-- Friends list -->
      <div class="space-y-2">
        <template x-for="f in friends" :key="f.id">
          <div class="flex items-center gap-3 group px-3 py-2.5 rounded-xl transition-colors" style="background:#12122A">
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold flex-shrink-0"
              style="background:rgba(124,58,237,0.2); color:#7C3AED"
              x-text="f.name[0].toUpperCase()"></div>
            <template x-if="editingId !== f.id">
              <span class="flex-1 text-sm text-white" x-text="f.name"></span>
            </template>
            <template x-if="editingId === f.id">
              <input x-model="editName" type="text" maxlength="100" class="neon-input flex-1 py-1 px-2 text-sm"
                style="border-radius:0.5rem"
                @keydown.enter="saveEdit(f.id)" @keydown.escape="editingId=null">
            </template>
            <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
              <template x-if="editingId !== f.id">
                <button @click="startEdit(f)" class="p-1 rounded transition-colors" style="color:#A0A0C0" onmouseover="this.style.color='#7C3AED'" onmouseout="this.style.color='#A0A0C0'">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </button>
              </template>
              <template x-if="editingId === f.id">
                <button @click="saveEdit(f.id)" class="p-1 rounded" style="color:#00F5FF">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                </button>
              </template>
              <button @click="deleteFriend(f.id)" class="p-1 rounded transition-colors" style="color:#A0A0C0" onmouseover="this.style.color='#FF006E'" onmouseout="this.style.color='#A0A0C0'">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </div>
        </template>
        <div x-show="friends.length === 0" class="text-center py-6 muted-text text-sm">
          No friends yet — add some to start splitting!
        </div>
      </div>
    </div>

    <!-- Recent Bills -->
    <div class="neon-card p-5">
      <h2 class="font-bold text-white mb-4 flex items-center gap-2">📋 Recent Bills</h2>
      <div class="space-y-2">
        <template x-for="bill in bills" :key="bill.id">
          <a :href="`/summary.html?bill_id=${bill.id}`"
            class="flex items-center justify-between px-4 py-3 rounded-xl transition-colors no-underline"
            style="background:#12122A" onmouseover="this.style.background='#1e1e3a'" onmouseout="this.style.background='#12122A'">
            <div>
              <div class="text-sm font-medium text-white" x-text="formatDate(bill.created_at)"></div>
              <div class="label-muted capitalize" x-text="bill.status"></div>
            </div>
            <svg class="w-4 h-4" style="color:#A0A0C0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </a>
        </template>
        <div x-show="bills.length === 0" class="text-center py-4 muted-text text-sm">No bills yet.</div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
