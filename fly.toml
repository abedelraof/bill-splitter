# fly.toml — generated for Bill Splitter
# Replace "bill-splitter-app" with your chosen app name (must be globally unique on Fly.io)

app = "bill-splitter-app"
primary_region = "lax"

[build]

[env]
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "bill_splitter_data"
  destination = "/data"
